name: Class Video & Media Converter

on:
  repository_dispatch:
    types: [compress_video]

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Process Media File
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python process.py \
            "${{ github.event.client_payload.chat_id }}" \
            "${{ github.event.client_payload.message_id }}" \
            "${{ github.event.client_payload.mode }}" \
            "${{ github.event.client_payload.resolution }}" \
            "${{ github.event.client_payload.preset }}" \
            "${{ github.event.client_payload.audio_format }}" \
            "${{ github.event.client_payload.codec }}"
